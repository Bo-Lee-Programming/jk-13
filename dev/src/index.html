<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>RAINWEAVER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03131d;color:#e2f3ec;font-family:Georgia,serif}canvas{display:block;width:100%;height:100%;cursor:crosshair}#hud{position:fixed;inset:0;pointer-events:none;padding:30px 38px;background:linear-gradient(#01101966,transparent 20%,transparent 85%,#01101977)}#top{display:flex;justify-content:space-between;align-items:center}.life{color:#b9f6eb;letter-spacing:5px;font:13px system-ui;text-shadow:0 0 13px #6ff}.label{font:9px system-ui;letter-spacing:3px;color:#93b5b6;margin-bottom:9px}#count{font-size:19px;color:#efd7a5;letter-spacing:5px}#location{position:absolute;left:50%;top:34px;transform:translateX(-50%);font:10px system-ui;letter-spacing:4px;color:#b9d6d5}#hint{position:absolute;bottom:30px;left:0;width:100%;text-align:center;font:10px system-ui;letter-spacing:2px;color:#b6d5d2}#panel{position:absolute;inset:0;background:linear-gradient(90deg,#02131de8, #02131d80 42%,transparent 75%);display:flex;align-items:center;padding:8vw;cursor:pointer}.card{max-width:420px}.eyebrow{font:10px system-ui;letter-spacing:5px;color:#a8ccc4;margin-bottom:26px}h1{font-weight:400;font-size:52px;letter-spacing:1px;margin:0;color:#ebfff4;text-shadow:0 0 45px #72d8d855;line-height:1.1}h2{font-size:17px;letter-spacing:6px;font-weight:400;color:#c6e4db;margin:16px 0 28px}p{font:13px/1.9 system-ui;color:#a8c2c2;max-width:315px}button{margin-top:26px;background:#72bdb411;border:1px solid #9edacc60;color:#d7f4e7;padding:17px 31px;font:10px system-ui;letter-spacing:4px;cursor:pointer;}.controls{font:9px/2 system-ui;letter-spacing:1.5px;margin-top:25px;color:#87a5aa}.hide{display:none!important}
body:has(#panel:not(.hide)) #hud{visibility:hidden}
#panel{animation:veil .65s ease-out}.card{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}button:hover,button:focus-visible{background:#72bdb433}@keyframes veil{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@media(prefers-reduced-motion:reduce){#panel,.card{animation:none}}
@media(max-height:600px){#panel{padding:6vw}.eyebrow{margin-bottom:12px}h2{margin:10px 0}p{line-height:1.6;margin:10px 0}button{margin-top:12px;padding:12px 22px}.controls{margin-top:12px;font-size:8px}}@media(max-width:500px){#hud{padding:24px 18px}.life{font-size:10px;letter-spacing:2px}#location{top:82px}#hint{padding:0 15px;font-size:8px}}
</style>
<canvas id="c" aria-label="Rainweaver 3D game"></canvas><div id="hud"><div id="top"><div><div class="label">DISTANCE / BEST</div><div class="life" id="hp">0 m</div></div><div><div class="label">SCORE · DEW +20</div><div id="count">0</div></div></div><div id="location">ENDLESS FLIGHT</div><div id="hint"></div></div>
<div id="panel"><div class="card"><div class="eyebrow">ONE THREAD. NO END.</div><h1 style="font-size:clamp(34px,5.5vw,78px);letter-spacing:3px">RAIN<br>WEAVER</h1><h2>OUTRUN THE DARK</h2><p>Catch. Swing. Release.<br>Dodge red thorns. Pink branches break.<br>Dew: +20 points.</p><button>TAKE FLIGHT &nbsp; →</button><div class="controls">A / D MOVE · SPACE JUMP<br>HOLD E / MOUSE CATCH · RELEASE FLY<br>R NEW RUN · ESC PAUSE · M SOUND</div></div></div>
<script type="module" src="./main.js"></script></html>
